services:
  ai-hub:
    image: ambrouse/ai-hub:0.1.1
    container_name: ai-hub
    restart: unless-stopped
    ports:
      - "${AIHUB_FRONTEND_PORT:-6901}:6901"
      - "${AIHUB_BACKEND_PORT:-6902}:6902"
    environment:
      AIHUB_FRONTEND_PORT: "6901"
      AIHUB_BACKEND_PORT: "6902"
    volumes:
      - ai-hub-deploy:/app/deploy
      - ai-hub-logs:/app/logs/hub
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:6902/api/health >/dev/null && curl -fsS http://127.0.0.1:6901 >/dev/null",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  ai-hub-deploy:
  ai-hub-logs:
